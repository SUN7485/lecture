<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>LVE self-heal fixture</title>
<!--
  Mission 035 real-chain fixture.

  Slide 2's .heal-card is intentionally a normal scene-v2 `shape`: its fill
  and border both have native PowerPoint equivalents.  CSS outline is not part
  of the scene contract, however.  The 40px negative offset deliberately
  keeps the whole unsupported outline *inside* the card bounds, so a
  self-heal bake of s1:0 captures every missing pixel.  It is large enough to
  exceed the frozen visual budget before that bake is applied.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  .slide {
    position: relative; width: 950px; height: 650px; box-sizing: border-box;
    overflow: hidden; padding: 58px 64px; background: #fff; color: #193553;
    font-family: Arial, sans-serif;
  }
  h1 { margin: 0 0 20px; font-size: 34px; line-height: 1.15; }
  p { margin: 0; font-size: 21px; line-height: 1.4; }

  /* This parent has no direct text; it serializes as the native `shape` node
     s1:0, while its child paragraph serializes separately as text. */
  .heal-card {
    position: absolute; left: 155px; top: 165px; width: 640px; height: 320px;
    box-sizing: border-box; background: #dbeafe; border: 4px solid #1d4e89;
    outline: 40px solid #e24040; outline-offset: -40px;
  }
  .heal-card p {
    position: absolute; inset: 102px 76px auto; color: #102c4a; font-size: 28px;
    font-weight: 700; line-height: 1.2; text-align: center;
  }

  table { width: 100%; border-collapse: collapse; font-size: 19px; }
  th, td { padding: 10px 14px; border: 1px solid #193553; text-align: center; }
  th { background: #193553; color: #fff; }
</style>
</head>
<body>

<!-- 1: deliberately ordinary native text. -->
<div class="slide">
  <h1>Clean native text</h1>
  <p>This control slide should verify without any bake.</p>
</div>

<!-- 2: the outline makes the first native candidate fail; self-heal bakes
     the outer card s1:0 and removes its child from the native candidate. -->
<div class="slide">
  <div class="heal-card"><p>Outline drift is repaired as one bounded bake.</p></div>
</div>

<!-- 3: a normal table provides a second, independently editable control. -->
<div class="slide">
  <h1>Clean native table</h1>
  <table>
    <tr><th>Item</th><th>Quantity</th><th>Value</th></tr>
    <tr><td>Alpha</td><td>12</td><td>240</td></tr>
    <tr><td>Beta</td><td>8</td><td>160</td></tr>
  </table>
</div>

</body>
</html>
