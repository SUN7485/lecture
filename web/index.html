<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide HTML Editor — edit HTML pages & decks visually, export PDF</title>
<meta name="description" content="Free online editor for HTML pages and slide decks. Edit text, move and resize anything like PowerPoint, then download the HTML or export a PDF. No signup, nothing uploaded.">
<style>
  :root { --bg:#1e2430; --panel:#273041; --text:#e8ecf3; --muted:#9aa4b8; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  button { background:#333d52; color:var(--text); border:1px solid #46536f; border-radius:6px;
           padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { background:#3d4961; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #toolbar { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--panel);
             border-bottom:1px solid #000; flex-wrap:wrap; }
  #toolbar .brand { font-weight:700; margin-inline-end:8px; }
  #toolbar .spacer { flex:1; }
  #stage { flex:1; overflow:auto; }
  #zoom-wrap { margin:24px auto; box-shadow:0 6px 30px rgba(0,0,0,.45); }
  #canvas { border:0; background:#fff; transform-origin:0 0; display:block; }
  #empty-state { margin:80px auto; max-width:540px; text-align:center; color:var(--muted);
                 border:2px dashed #46536f; border-radius:12px; padding:48px 32px; }
  #empty-state h1 { color:var(--text); font-size:22px; margin:0 0 8px; }
  #status { padding:5px 12px; background:var(--panel); color:var(--muted); border-top:1px solid #000;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* ---------- Slide Doctor dock (008B): fixed overlay on the right (web has no #body flex row) ---------- */
  #doctor-dock { position:fixed; top:56px; right:0; bottom:28px; width:340px; z-index:20;
                 display:none; flex-direction:column; background:#fbfbfd; color:#1f2733;
                 border-inline-start:1px solid #d3d9e3; box-shadow:-2px 0 14px rgba(0,0,0,.35); }
  #doctor-dock.open { display:flex; }
  .dr-head { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid #dde3ec; font-weight:700; color:#1f2733; }
  .dr-head .spacer { flex:1; }
  .dr-x { padding:2px 9px; background:#eef2ff; color:#1f2733; border:1px solid #c7d2fe; }
  .dr-list { direction:rtl; flex:1; overflow-y:auto; padding:8px 12px; display:flex; flex-direction:column; gap:8px; }
  .dr-group { font-size:11.5px; font-weight:700; color:#6b7280; margin-top:6px; }
  .dr-row { border:1px solid #e5e7eb; border-radius:9px; background:#fff; padding:8px 10px; cursor:pointer;
            display:flex; flex-direction:column; gap:6px; color:#1f2733; }
  .dr-row:hover { border-color:#b9a6ef; }
  .dr-row.err { border-inline-start:3px solid #e11d48; }
  .dr-row.warn { border-inline-start:3px solid #d97706; }
  .dr-chip { align-self:flex-start; font-size:10.5px; background:#eef2ff; border:1px solid #c7d2fe; border-radius:999px; padding:1px 8px; }
  .dr-fix { align-self:flex-start; padding:3px 10px; font-size:12px; background:#333d52; color:#e8ecf3; border:1px solid #46536f; }
  #btn-doctor.has-issues { color:#ff6b6b; font-weight:700; }
  .dr-empty { color:#6b7280; text-align:center; padding:24px 8px; font-size:13px; }
  /* ---------- Command palette (009) ---------- */
  #cmdk { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:none; align-items:flex-start; justify-content:center; }
  #cmdk.open { display:flex; }
  .cmdk-box { margin-top:12vh; width:min(520px,92vw); background:var(--panel); border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); overflow:hidden; border:1px solid #46536f; }
  .cmdk-input { width:100%; box-sizing:border-box; border:0; border-bottom:1px solid #46536f; padding:14px 16px; font-size:15px; direction:rtl; outline:none; background:var(--panel); color:var(--text); }
  .cmdk-list { list-style:none; margin:0; padding:6px; max-height:50vh; overflow-y:auto; direction:rtl; }
  .cmdk-row { padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; }
  .cmdk-row.on { background:#3d4961; }
</style>
</head>
<body>
  <div id="toolbar">
    <span class="brand">📘 Slide HTML Editor</span>
    <button id="btn-open" title="Open an HTML file">📂 Open</button>
    <button id="btn-add-text" title="Insert a text block">➕ Text</button>
    <button id="btn-add-image" title="Insert an image (embedded into the file)">🖼 Image</button>
    <button id="btn-undo" disabled title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="btn-redo" disabled title="Redo (Ctrl+Y)">↷ Redo</button>
    <button id="btn-zoom-out" title="Zoom out">−</button>
    <button id="btn-zoom-label" title="Fit to window">100%</button>
    <button id="btn-zoom-in" title="Zoom in">+</button>
    <button id="btn-doctor" title="فحص الشرائح — نص كثيف، تباين، خطوط، صور مشوّهة، تسمية الأشكال">🩺 الفحص</button>
    <span class="spacer"></span>
    <button id="btn-export" class="primary" title="Export to PDF — choose 'Save as PDF' in the print dialog">⬇ PDF</button>
    <button id="btn-save" class="primary" title="Download the edited HTML (Ctrl+S)">💾 Save HTML</button>
  </div>
  <div id="stage">
    <div id="empty-state">
      <h1>Edit any HTML page like a slide deck</h1>
      <p>Drop an .html file here — got one from ChatGPT, Claude or Gemini? Edit the text, move and resize anything like PowerPoint, then download it or export a PDF.</p>
      <p><strong>Nothing is uploaded.</strong> Everything runs in your browser.</p>
      <button id="btn-open-2" class="primary">📂 Choose HTML file</button>
    </div>
    <div id="zoom-wrap" hidden><iframe id="canvas"></iframe></div>
  </div>
  <div id="status">Open an HTML file to start.</div>
  <input type="file" id="file-input" accept=".html,.htm" hidden>
  <input type="file" id="img-input" accept="image/*" multiple hidden>
  <script src="editor.js"></script>
  <script src="doctor.js"></script>
  <script src="app.js"></script>
</body>
</html>
